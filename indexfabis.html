          `;

            mainContent.innerHTML = html;
            STATE.currentView = 'profile';
            updateNav();

            attachPostListeners();
            $$('.follow-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.dataset.userid;
                    toggleFollow(targetId);
                });
            });
        }

        // -------- EDIT PROFILE --------
        function renderEditProfile() {
            const user = STATE.userProfile;
            if (!user) return;
            openModal(`
            <h3 class="text-xl font-bold mb-4">Edit Profile</h3>
            <div class="space-y-4">
              <div>
                <label class="text-sm text-white/40 block mb-1">Display Name</label>
                <input type="text" id="editDisplayName" class="input-dark" value="${escapeHtml(user.displayName)}" />
              </div>
              <div>
                <label class="text-sm text-white/40 block mb-1">Bio</label>
                <textarea id="editBio" class="input-dark" rows="3">${escapeHtml(user.bio || '')}</textarea>
              </div>
              <div class="flex gap-3">
                <button class="btn-primary flex-1" id="saveProfile">Save</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
              </div>
            </div>
          `);
            document.getElementById('saveProfile').addEventListener('click', async () => {
                const displayName = document.getElementById('editDisplayName').value.trim();
                const bio = document.getElementById('editBio').value.trim();
                if (displayName) {
                    await updateProfile(displayName, bio);
                    closeModal();
                    renderProfile(STATE.currentUser.uid);
                } else {
                    showToast('Display name is required', 'error');
                }
            });
        }

        // -------- SETTINGS --------
        function renderSettings() {
            const user = STATE.userProfile;
            if (!user) return;
            const theme = user.settings?.theme || 'dark';
            const privacy = user.settings?.privacy || 'public';

            openModal(`
            <h3 class="text-xl font-bold mb-4">Settings</h3>
            <div class="space-y-4">
              <div>
                <label class="text-sm text-white/40 block mb-1">Theme</label>
                <div class="flex gap-2">
                  <button class="btn-secondary text-sm flex-1 theme-btn ${theme === 'dark' ? 'btn-primary' : ''}" data-theme="dark">Dark</button>
                  <button class="btn-secondary text-sm flex-1 theme-btn ${theme === 'light' ? 'btn-primary' : ''}" data-theme="light">Light</button>
                </div>
              </div>
              <div>
                <label class="text-sm text-white/40 block mb-1">Privacy</label>
                <div class="flex gap-2">
                  <button class="btn-secondary text-sm flex-1 privacy-btn ${privacy === 'public' ? 'btn-primary' : ''}" data-privacy="public">Public</button>
                  <button class="btn-secondary text-sm flex-1 privacy-btn ${privacy === 'private' ? 'btn-primary' : ''}" data-privacy="private">Private</button>
                </div>
              </div>
              <hr class="border-white/5" />
              <button class="btn-secondary w-full text-sm" onclick="renderChangeUsername()">Change Username</button>
              <button class="btn-secondary w-full text-sm" onclick="renderChangePassword()">Change Password</button>
              <button class="btn-danger w-full text-sm" onclick="logout(); closeModal();">Logout</button>
              <p class="text-xs text-white/20 text-center mt-4">FABIS v1.0.0 · Created by SIFAT</p>
              <p class="text-xs text-white/10 text-center">Copyright © 2026 SIFAT STUDIO</p>
            </div>
          `);

            $$('.theme-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const theme = btn.dataset.theme;
                    await db.collection('users').doc(STATE.currentUser.uid).update({
                        'settings.theme': theme
                    });
                    STATE.userProfile.settings.theme = theme;
                    document.body.classList.toggle('light-mode', theme === 'light');
                    renderSettings();
                });
            });

            $$('.privacy-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const privacy = btn.dataset.privacy;
                    await db.collection('users').doc(STATE.currentUser.uid).update({
                        'settings.privacy': privacy
                    });
                    STATE.userProfile.settings.privacy = privacy;
                    renderSettings();
                    showToast('Privacy updated', 'info');
                });
            });
        }

        function renderChangeUsername() {
            openModal(`
            <h3 class="text-xl font-bold mb-4">Change Username</h3>
            <p class="text-sm text-white/30 mb-4">Current: @${STATE.userProfile.username}</p>
            <div class="space-y-4">
              <input type="text" id="newUsername" class="input-dark" placeholder="New username" />
              <div class="flex gap-3">
                <button class="btn-primary flex-1" id="saveUsername">Update</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
              </div>
            </div>
          `);
            document.getElementById('saveUsername').addEventListener('click', async () => {
                const newUsername = document.getElementById('newUsername').value.trim();
                if (!newUsername || newUsername.length < 3) {
                    showToast('Username must be at least 3 characters', 'error');
                    return;
                }
                await updateUsername(newUsername);
                closeModal();
                renderProfile(STATE.currentUser.uid);
            });
        }

        function renderChangePassword() {
            openModal(`
            <h3 class="text-xl font-bold mb-4">Change Password</h3>
            <div class="space-y-4">
              <input type="password" id="currentPassword" class="input-dark" placeholder="Current password" />
              <input type="password" id="newPassword" class="input-dark" placeholder="New password (min 6 chars)" />
              <div class="flex gap-3">
                <button class="btn-primary flex-1" id="savePassword">Update</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
              </div>
            </div>
          `);
            document.getElementById('savePassword').addEventListener('click', async () => {
                const current = document.getElementById('currentPassword').value;
                const newPwd = document.getElementById('newPassword').value;
                // Re-authenticate
                const user = auth.currentUser;
                const cred = firebase.auth.EmailAuthProvider.credential(user.email, current);
                try {
                    await user.reauthenticateWithCredential(cred);
                    if (!newPwd || newPwd.length < 6) {
                        showToast('New password must be at least 6 characters', 'error');
                        return;
                    }
                    await updatePassword(newPwd);
                    closeModal();
                } catch (err) {
                    showToast('Current password is incorrect', 'error');
                }
            });
        }

        // -------- ADMIN PANEL --------
        function renderAdminPanel() {
            if (!STATE.userProfile?.isAdmin) { showToast('Admin access required', 'error'); return; }
            const users = STATE.users;
            const posts = STATE.posts;

            openModal(`
            <h3 class="text-xl font-bold mb-4">Admin Panel</h3>
            <div class="text-sm text-white/40 mb-2">${users.length} users · ${posts.length} posts</div>

            <div class="mb-4">
              <h4 class="font-semibold text-sm text-white/60 mb-2">Users</h4>
              <div class="max-h-60 overflow-y-auto space-y-1">
                ${users.map(u => `
                  <div class="flex items-center justify-between py-1.5 border-b border-white/5 text-sm">
                    <span>${u.displayName} <span class="text-white/30">@${u.username}</span> ${u.isAdmin ? '👑' : ''} ${u.isSuspended ? '🚫' : ''}</span>
                    <div class="flex gap-1">
                      <button class="text-xs px-2 py-0.5 rounded bg-white/5 hover:bg-white/10 suspend-btn" data-userid="${u.uid}">${u.isSuspended ? 'Unsuspend' : 'Suspend'}</button>
                      <button class="text-xs px-2 py-0.5 rounded bg-white/5 hover:bg-white/10 view-user-btn" data-userid="${u.uid}">View</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <h4 class="font-semibold text-sm text-white/60 mb-2">Recent Posts</h4>
              <div class="max-h-60 overflow-y-auto space-y-1">
                ${posts.slice(0, 20).map(p => {
                  const pu = getUser(p.userId);
                  return `
                    <div class="flex items-center justify-between py-1.5 border-b border-white/5 text-sm">
                      <span class="text-white/60 truncate max-w-[200px]">${escapeHtml(p.text.slice(0, 50))}${p.text.length > 50 ? '...' : ''}</span>
                      <span class="text-white/20 text-xs">${pu ? '@'+pu.username : 'unknown'}</span>
                      <button class="text-xs px-2 py-0.5 rounded bg-red-500/10 hover:bg-red-500/20 text-red-400 delete-post-admin" data-postid="${p.id}">Delete</button>
                    </div>
                  `;
                }).join('')}
                ${posts.length === 0 ? '<p class="text-white/30 text-sm">No posts</p>' : ''}
              </div>
            </div>

            <button class="btn-secondary w-full mt-4 text-sm" onclick="closeModal()">Close</button>
          `);

            $$('.suspend-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const uid = btn.dataset.userid;
                    await suspendUser(uid);
                    closeModal();
                    setTimeout(renderAdminPanel, 300);
                });
            });

            $$('.view-user-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const uid = btn.dataset.userid;
                    closeModal();
                    viewProfile(uid);
                });
            });

            $$('.delete-post-admin').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('Delete this post?')) {
                        await deletePostAdmin(btn.dataset.postid);
                        closeModal();
                        setTimeout(renderAdminPanel, 300);
                    }
                });
            });
        }

        // -------- VIEW PROFILE (global) --------
        window.viewProfile = function(uid) {
            renderProfile(uid);
        };

        // -------- NAVIGATION --------
        document.addEventListener('click', (e) => {
            const navItem = e.target.closest('.bottom-nav .nav-item');
            if (navItem) {
                const view = navItem.dataset.view;
                if (view === 'profile' && !STATE.currentUser) {
                    showToast('Please login first', 'error');
                    return;
                }
                if (view === 'create' && !STATE.currentUser) {
                    showToast('Please login to create posts', 'error');
                    return;
                }
                if (view === 'notifications' && !STATE.currentUser) {
                    showToast('Please login to see notifications', 'error');
                    return;
                }
                STATE.currentView = view;
                renderCurrentView();
            }
        });

        // -------- AUTH STATE OBSERVER --------
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Fetch profile
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    STATE.currentUser = user;
                    STATE.userProfile = doc.data();
                    // Apply theme
                    if (STATE.userProfile.settings?.theme === 'light') {
                        document.body.classList.add('light-mode');
                    } else {
                        document.body.classList.remove('light-mode');
                    }
                    renderApp();
                } else {
                    // Profile missing, sign out
                    await auth.signOut();
                }
            } else {
                STATE.currentUser = null;
                STATE.userProfile = null;
                renderApp();
            }
        });

        // -------- INIT --------
        // Show splash for a moment
        setTimeout(() => {
            splash.classList.add('hidden');
            // If already authenticated, renderApp will be called by onAuthStateChanged
            if (!STATE.currentUser) {
                renderApp();
            }
        }, 1200);

        // Global close modal on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        console.log('🚀 FABIS v1.0.0 (Firebase)');
        console.log('📝 Created by SIFAT');
        console.log('⚡ Powered by SIFAT STUDIO');
        console.log('© 2026 SIFAT STUDIO. All rights reserved.');
    </script>
</body>
</html>
